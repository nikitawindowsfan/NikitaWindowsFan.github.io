<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анимированные часы - Поцифровая анимация</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f4f4;
            overflow: hidden;
            position: relative;
            font-family: 'Montserrat', sans-serif;
        }

        /* Плавный фон (60 FPS / GPU) */
        .bg-animated {
            position: absolute;
            top: -50vh;
            left: -50vw;
            width: 200vw;
            height: 200vh;
            background: repeating-linear-gradient(
                90deg,
                #fcfcfc 0px, #fcfcfc 40px,
                #f5f5f5 40px, #f5f5f5 80px,
                #eeeeee 80px, #eeeeee 120px,
                #e8e8e8 120px, #e8e8e8 160px
            );
            z-index: 1;
            will-change: transform; 
            animation: slideBackground 8s linear infinite;
        }

        .overlay-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(to top, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* Контейнер часов */
        .clock-container {
            position: relative;
            z-index: 3;
            color: #2b2b2b;
            font-size: 10vw;
            font-weight: 800;
            text-shadow: 0px 4px 15px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            font-variant-numeric: tabular-nums; 
        }

        /* Каждая цифра теперь — отдельный независимый блок */
        .digit {
            display: inline-block;
            min-width: 6vw; /* Задаем фиксированную ширину для каждого символа */
            text-align: center;
            will-change: transform, opacity;
        }

        /* Разделительные точки */
        .colon {
            margin: 0 0.3vw;
            transform: translateY(-0.5vw);
            animation: pulseColon 1s ease-in-out infinite alternate;
            will-change: opacity;
        }

        /* Поочередное мигание точек */
        .colon-1 { animation-delay: 0s; }
        .colon-2 { animation-delay: 0.5s; }

        /* Плавный сдвиг влево для ОДНОЙ цифры */
        .animate-digit {
            animation: slideLeft 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes slideBackground {
            0% { transform: rotate(-14deg) translate3d(0, 0, 0); }
            100% { transform: rotate(-14deg) translate3d(-160px, 0, 0); }
        }

        @keyframes pulseColon {
            0% { opacity: 0.15; }
            100% { opacity: 1; }
        }

        /* Анимация заезда справа налево */
        @keyframes slideLeft {
            0% { transform: translate3d(15px, 0, 0); opacity: 0; }
            100% { transform: translate3d(0, 0, 0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="bg-animated"></div>
    <div class="overlay-bottom"></div>

    <div class="clock-container">
        <div id="h1" class="digit">0</div>
        <div id="h2" class="digit">0</div>
        
        <div class="colon colon-1">:</div>
        
        <div id="m1" class="digit">0</div>
        <div id="m2" class="digit">0</div>
        
        <div class="colon colon-2">:</div>
        
        <div id="s1" class="digit">0</div>
        <div id="s2" class="digit">0</div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const moscowTimeStr = now.toLocaleString("en-US", {timeZone: "Europe/Moscow"});
            const moscowDate = new Date(moscowTimeStr);

            const hours = String(moscowDate.getHours()).padStart(2, '0');
            const minutes = String(moscowDate.getMinutes()).padStart(2, '0');
            const seconds = String(moscowDate.getSeconds()).padStart(2, '0');

            // Проверяем и обновляем абсолютно каждую цифру отдельно
            updateSingleDigit('h1', hours[0]);
            updateSingleDigit('h2', hours[1]);
            updateSingleDigit('m1', minutes[0]);
            updateSingleDigit('m2', minutes[1]);
            updateSingleDigit('s1', seconds[0]);
            updateSingleDigit('s2', seconds[1]);
        }

        // Логика поцифровой анимации
        function updateSingleDigit(id, nextValue) {
            const el = document.getElementById(id);
            
            // Анимация срабатывает только если конкретно эта цифра изменилась!
            if (el.innerText !== nextValue) {
                el.classList.remove('animate-digit');
                void el.offsetWidth; // Хак для сброса CSS-анимации
                el.innerText = nextValue;
                el.classList.add('animate-digit');
            }
        }

        // Самокорректирующийся цикл: на каждом тике заново
        // вычисляем, сколько осталось до следующей реальной секунды,
        // поэтому часы никогда не "уплывают" от реального времени
        // (в отличие от setInterval, который со временем накапливает погрешность).
        function scheduleNextTick() {
            updateTime();
            const now = new Date();
            const msToNextSecond = 1000 - now.getMilliseconds();
            setTimeout(scheduleNextTick, msToNextSecond);
        }

        scheduleNextTick();
    </script>

</body>
</html>
