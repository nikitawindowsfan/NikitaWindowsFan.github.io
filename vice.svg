<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12021d"/>
      <stop offset=".18" stop-color="#2a0338"/>
      <stop offset=".36" stop-color="#5c0748"/>
      <stop offset=".52" stop-color="#a5185a"/>
      <stop offset=".66" stop-color="#e83d55"/>
      <stop offset=".76" stop-color="#ff6b3d"/>
      <stop offset=".86" stop-color="#ff9f42"/>
      <stop offset=".94" stop-color="#ffcc72"/>
      <stop offset="1" stop-color="#ffe6ae"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx=".5" cy=".42" r=".62">
      <stop offset="0" stop-color="#fff7c9"/>
      <stop offset=".45" stop-color="#ffdc7a"/>
      <stop offset=".75" stop-color="#ff9a4d"/>
      <stop offset="1" stop-color="#ff4f7d"/>
    </radialGradient>
    <linearGradient id="cityGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0733"/>
      <stop offset="1" stop-color="#140120"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a0b46"/>
      <stop offset="1" stop-color="#12011c"/>
    </linearGradient>
    <linearGradient id="glowLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2e88" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ff9f42"/>
      <stop offset="1" stop-color="#00e0c6" stop-opacity="0"/>
    </linearGradient>
    <!-- маска солнца: круг с горизонтальными вырезами -->
    <mask id="sunMask">
      <rect x="0" y="0" width="1600" height="1000" fill="#fff"/>
      <g fill="#000">
        <rect x="480" y="560" width="640" height="9"/>
        <rect x="480" y="586" width="640" height="11"/>
        <rect x="480" y="614" width="640" height="13"/>
        <rect x="480" y="644" width="640" height="15"/>
        <rect x="480" y="676" width="640" height="17"/>
        <rect x="480" y="710" width="640" height="19"/>
        <rect x="480" y="746" width="640" height="21"/>
        <rect x="480" y="784" width="640" height="24"/>
      </g>
    </mask>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- небо -->
  <rect width="1600" height="1000" fill="url(#sky)"/>

  <!-- звёзды в верхней части -->
  <g fill="#fff" opacity=".5">
    <circle cx="180" cy="70" r="1.6"/><circle cx="420" cy="120" r="1.2"/>
    <circle cx="760" cy="60" r="1.5"/><circle cx="1080" cy="110" r="1.1"/>
    <circle cx="1320" cy="56" r="1.7"/><circle cx="1480" cy="160" r="1.2"/>
    <circle cx="90" cy="220" r="1.1"/><circle cx="950" cy="180" r="1"/>
    <circle cx="640" cy="210" r="1.2"/><circle cx="1240" cy="240" r=".9"/>
  </g>

  <!-- солнце: свечение + полосатый диск -->
  <circle cx="800" cy="640" r="330" fill="#ff7a4a" opacity=".28" filter="url(#soft)"/>
  <g mask="url(#sunMask)">
    <circle cx="800" cy="640" r="255" fill="url(#sunGrad)"/>
  </g>

  <!-- дальние холмы -->
  <path d="M0 812 L140 786 L300 806 L470 772 L640 800 L820 774 L1010 802 L1190 776 L1370 804 L1600 782 L1600 1000 L0 1000 Z"
        fill="#3d0842" opacity=".85"/>

  <!-- город: силуэт -->
  <g fill="url(#cityGrad)">
    <rect x="0" y="838" width="1500" height="162"/>
    <!-- левый кластер -->
    <rect x="60" y="742" width="54" height="98"/>
    <rect x="120" y="772" width="38" height="68"/>
    <rect x="164" y="724" width="62" height="116"/>
    <rect x="232" y="792" width="46" height="48"/>
    <rect x="284" y="756" width="34" height="84"/>
    <!-- центр-лево -->
    <rect x="372" y="798" width="70" height="42"/>
    <rect x="450" y="762" width="44" height="78"/>
    <rect x="500" y="806" width="86" height="34"/>
    <!-- правее центра -->
    <rect x="960" y="788" width="58" height="52"/>
    <rect x="1026" y="748" width="46" height="92"/>
    <rect x="1080" y="782" width="72" height="58"/>
    <rect x="1160" y="716" width="54" height="124"/>
    <rect x="1222" y="768" width="40" height="72"/>
    <rect x="1270" y="800" width="64" height="40"/>
    <rect x="1342" y="760" width="46" height="80"/>
    <rect x="1396" y="790" width="88" height="50"/>
    <rect x="1490" y="744" width="48" height="96"/>
    <!-- антенны -->
    <rect x="186" y="690" width="4" height="36"/>
    <rect x="1184" y="682" width="4" height="36"/>
  </g>

  <!-- окна: редкие тёплые точки -->
  <g fill="#ffcf7a" opacity=".55">
    <rect x="76" y="762" width="7" height="9"/><rect x="92" y="784" width="7" height="9"/>
    <rect x="182" y="744" width="8" height="10"/><rect x="202" y="776" width="8" height="10"/>
    <rect x="1040" y="768" width="7" height="9"/><rect x="1176" y="736" width="8" height="10"/>
    <rect x="1196" y="788" width="8" height="10"/><rect x="1356" y="782" width="7" height="9"/>
    <rect x="1504" y="766" width="7" height="9"/><rect x="466" y="784" width="7" height="9"/>
  </g>

  <!-- вода -->
  <rect x="0" y="900" width="1600" height="100" fill="url(#waterGrad)"/>
  <!-- солнечная дорожка на воде -->
  <g fill="#ffb35c" opacity=".5">
    <rect x="700" y="906" width="200" height="4" rx="2"/>
    <rect x="724" y="922" width="152" height="4" rx="2"/>
    <rect x="690" y="938" width="220" height="5" rx="2"/>
    <rect x="736" y="956" width="128" height="4" rx="2"/>
    <rect x="706" y="974" width="188" height="5" rx="2"/>
  </g>

  <!-- пальма слева -->
  <g fill="#0d0116">
    <path d="M196 1000c10-118 22-198 56-262 6-10 20-6 17 5-32 74-44 156-50 257z"/>
    <path d="M264 748c-44-40-96-48-152-30 44-32 108-26 158 18z"/>
    <path d="M264 748c-50-18-88-2-124 30 32-44 92-56 130-40z"/>
    <path d="M262 746c-14-56 4-102 44-134-22 42-30 88-34 134z"/>
    <path d="M264 746c22-46 64-70 120-68-50 16-88 40-110 78z"/>
    <path d="M266 750c48-26 100-16 140 22-54-28-106-30-140-8z"/>
    <path d="M262 750c-36 8-64 34-78 72 12-42 40-70 78-80z"/>
  </g>

  <!-- пальма справа -->
  <g fill="#0d0116">
    <path d="M1372 1000c6-126 14-210 46-278 5-11 20-8 18 4-28 80-38 166-44 274z"/>
    <path d="M1436 714c-48-42-104-50-164-30 48-34 116-26 168 20z"/>
    <path d="M1436 714c-54-20-96-2-134 32 34-48 100-62 140-44z"/>
    <path d="M1434 712c-16-60 6-108 48-142-24 46-32 94-36 142z"/>
    <path d="M1436 712c24-50 68-76 128-74-54 18-94 42-118 82z"/>
    <path d="M1438 716c52-28 108-18 150 24-58-30-112-32-150-8z"/>
    <path d="M1434 716c-38 8-68 36-84 76 14-44 42-74 84-84z"/>
  </g>

  <!-- тонкая неоновая линия горизонта -->
  <rect x="0" y="898" width="1600" height="3" fill="url(#glowLine)" opacity=".9"/>

  <!-- виньетка для читаемости контента -->
  <rect width="1600" height="1000" fill="#0b0113" opacity=".18"/>
</svg>
