<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Плашка для OBS</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body {
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    line-height: 1.35;
  }

  /* ================= ОВЕРЛЕЙ (Browser Source) ================= */
  #overlay { position: fixed; inset: 0; pointer-events: none; }
  .bar {
    position: absolute;
    left: 3vw; right: 3vw;
    bottom: calc(var(--bottom, 60) * 1px);
    display: flex; align-items: center; flex-wrap: wrap;
    gap: .3em .9em;
    padding: .55em .8em;
    font-size: calc(var(--fs, 34) * 1px);
    background: rgba(18, 18, 20, .84);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: .7em;
    box-shadow: 0 .4em 1.4em rgba(0,0,0,.35);
    opacity: 0;
    transform: translateY(40%);
    transition: opacity .45s ease, transform .55s cubic-bezier(.2,.8,.2,1);
  }
  .bar.show { opacity: 1; transform: none; }
  .badge {
    display: inline-flex; align-items: center; gap: .45em;
    padding: .38em .8em;
    background: var(--badge, #e0242f);
    color: #fff;
    font-weight: 800;
    font-size: .92em;
    border-radius: .4em;
    white-space: nowrap;
  }
  .badge.caps { text-transform: uppercase; }
  .badge.dot::before {
    content: ""; width: .42em; height: .42em; border-radius: 50%;
    background: #fff; flex: none;
  }
  .badge:empty { display: none; }
  .text { min-width: 0; overflow-wrap: anywhere; }
  .title { font-weight: 700; color: #fff; }
  .sub { font-weight: 500; color: #9b9ea6; }

  /* ================= ПАНЕЛЬ (Custom Browser Dock) ================= */
  #panel { display: none; }
  body.panel { background: #1f2126; color: #e6e8ec; overflow: auto; }
  body.panel #overlay { display: none; }
  body.panel #panel { display: block; padding: 12px; font-size: 14px; }
  #panel h1 { font-size: 15px; margin: 0 0 12px; font-weight: 700; }
  #panel label.f { display: grid; gap: 4px; margin-bottom: 10px; font-size: 12px; color: #9aa1ad; font-weight: 600; }
  #panel input[type="text"] {
    width: 100%; font: inherit; font-size: 14px; color: #fff;
    background: #14161a; border: 1px solid #3a3f48; border-radius: 6px; padding: 8px 10px;
  }
  #panel input[type="range"] { width: 100%; }
  #panel input[type="color"] { width: 40px; height: 30px; padding: 0; border: 1px solid #3a3f48; border-radius: 6px; background: none; }
  #panel .row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 10px; }
  #panel .chk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  #panel button {
    font: inherit; font-weight: 600; color: #fff; background: #2c3038;
    border: 1px solid #3a3f48; border-radius: 6px; padding: 8px 12px; cursor: pointer;
  }
  #panel button:hover { border-color: #6b7280; }
  #panel button.go { background: #e0242f; border-color: #e0242f; }
  #panel button:focus-visible, #panel input:focus-visible { outline: 2px solid #e0242f; outline-offset: 2px; }
  #panel .hint { font-size: 11px; color: #7d8492; margin: 8px 0 0; }
</style>
</head>
<body>

<div id="overlay">
  <div class="bar" id="bar">
    <span class="badge dot caps" id="oBadge"></span>
    <span class="text">
      <span class="title" id="oTitle"></span>
      <span class="sub" id="oSub"></span>
    </span>
  </div>
</div>

<div id="panel">
  <h1>Плашка</h1>
  <label class="f">Метка (красная)
    <input type="text" id="pBadge" autocomplete="off">
  </label>
  <label class="f">Основной текст
    <input type="text" id="pTitle" autocomplete="off">
  </label>
  <label class="f">Подзаголовок
    <input type="text" id="pSub" autocomplete="off">
  </label>
  <div class="row">
    <label class="chk">Цвет <input type="color" id="pColor"></label>
    <label class="chk"><input type="checkbox" id="pDot"> Точка</label>
    <label class="chk"><input type="checkbox" id="pCaps"> Заглавные</label>
  </div>
  <label class="f">Размер текста: <span id="pSizeV"></span> px
    <input type="range" id="pSize" min="14" max="90" step="1">
  </label>
  <label class="f">Отступ снизу: <span id="pBottomV"></span> px
    <input type="range" id="pBottom" min="0" max="400" step="5">
  </label>
  <div class="row">
    <button class="go" id="pShow" type="button">Показать</button>
    <button id="pHide" type="button">Скрыть</button>
    <button id="pReset" type="button">Сбросить</button>
  </div>
  <p class="hint">Изменения сразу попадают в источник «Браузер» в OBS.</p>
</div>

<script>
(function () {
  var DEFAULT = {
    badge: 'Внимание',
    title: 'Это тестовый эфир.',
    sub: 'Тут ничего интересного не будет',
    color: '#e0242f',
    dot: true, caps: true,
    size: 34, bottom: 60,
    visible: true
  };
  var KEY = 'obs-lower-third-v1';
  var params = new URLSearchParams(location.search);
  var isPanel = params.has('panel');
  var fromUrl = ['badge','title','sub','color','size','bottom','dot','caps']
    .some(function (k) { return params.has(k); });

  var channel = null;
  try { channel = new BroadcastChannel(KEY); } catch (e) {}

  function readStorage() {
    try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; }
  }
  function parse(raw) {
    var s = {};
    try { s = JSON.parse(raw || '{}'); } catch (e) {}
    return Object.assign({}, DEFAULT, s);
  }
  function stateFromUrl() {
    var s = Object.assign({}, DEFAULT);
    ['badge','title','sub','color'].forEach(function (k) {
      if (params.has(k)) s[k] = params.get(k);
    });
    ['size','bottom'].forEach(function (k) {
      if (params.has(k) && !isNaN(+params.get(k))) s[k] = +params.get(k);
    });
    ['dot','caps'].forEach(function (k) {
      if (params.has(k)) s[k] = params.get(k) !== '0' && params.get(k) !== 'false';
    });
    return s;
  }

  var state = (fromUrl && !isPanel) ? stateFromUrl() : parse(readStorage());
  var lastRaw = readStorage();

  function save() {
    var raw = JSON.stringify(state);
    lastRaw = raw;
    try { localStorage.setItem(KEY, raw); } catch (e) {}
    try { if (channel) channel.postMessage(raw); } catch (e) {}
  }

  /* ---------- оверлей ---------- */
  var bar = document.getElementById('bar');
  var oBadge = document.getElementById('oBadge');
  var oTitle = document.getElementById('oTitle');
  var oSub = document.getElementById('oSub');

  function render() {
    oBadge.textContent = state.badge;
    oTitle.textContent = state.title;
    oSub.textContent = state.sub;
    oBadge.classList.toggle('dot', !!state.dot);
    oBadge.classList.toggle('caps', !!state.caps);
    oBadge.style.setProperty('--badge', state.color);
    bar.style.setProperty('--fs', state.size);
    bar.style.setProperty('--bottom', state.bottom);
    bar.classList.toggle('show', !!state.visible);
  }

  function applyRaw(raw) {
    if (!raw || raw === lastRaw) return;
    lastRaw = raw;
    state = parse(raw);
    render();
    if (isPanel) fillPanel();
  }

  if (!isPanel && !fromUrl) {
    window.addEventListener('storage', function (e) {
      if (e.key === KEY) applyRaw(e.newValue);
    });
    if (channel) channel.onmessage = function (e) { applyRaw(e.data); };
    setInterval(function () { applyRaw(readStorage()); }, 500);
  }

  /* ---------- панель ---------- */
  function $(id) { return document.getElementById(id); }

  function fillPanel() {
    $('pBadge').value = state.badge;
    $('pTitle').value = state.title;
    $('pSub').value = state.sub;
    $('pColor').value = state.color;
    $('pDot').checked = !!state.dot;
    $('pCaps').checked = !!state.caps;
    $('pSize').value = state.size;
    $('pBottom').value = state.bottom;
    $('pSizeV').textContent = state.size;
    $('pBottomV').textContent = state.bottom;
  }

  if (isPanel) {
    document.body.classList.add('panel');
    fillPanel();

    function bindText(id, key) {
      $(id).addEventListener('input', function (e) { state[key] = e.target.value; save(); });
    }
    bindText('pBadge', 'badge');
    bindText('pTitle', 'title');
    bindText('pSub', 'sub');
    $('pColor').addEventListener('input', function (e) { state.color = e.target.value; save(); });
    $('pDot').addEventListener('change', function (e) { state.dot = e.target.checked; save(); });
    $('pCaps').addEventListener('change', function (e) { state.caps = e.target.checked; save(); });
    $('pSize').addEventListener('input', function (e) {
      state.size = +e.target.value; $('pSizeV').textContent = state.size; save();
    });
    $('pBottom').addEventListener('input', function (e) {
      state.bottom = +e.target.value; $('pBottomV').textContent = state.bottom; save();
    });
    $('pShow').addEventListener('click', function () { state.visible = true; save(); });
    $('pHide').addEventListener('click', function () { state.visible = false; save(); });
    $('pReset').addEventListener('click', function () {
      state = Object.assign({}, DEFAULT); save(); fillPanel();
    });
  } else {
    render();
    // первое появление с анимацией
    bar.classList.remove('show');
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { bar.classList.toggle('show', !!state.visible); });
    });
  }
})();
</script>
</body>
</html>
